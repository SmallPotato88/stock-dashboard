<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>个股详情｜股神A股交易决策看板</title>
  <style>
    :root{--bg:#080d1a;--panel:#111827;--panel2:#151f34;--muted:#93a4c7;--text:#edf3ff;--line:#26324d;--red:#ff4d5e;--green:#22c55e;--gold:#fbbf24;--blue:#60a5fa}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at top left,#172554 0,#080d1a 42%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,'Microsoft YaHei',sans-serif}.wrap{max-width:1220px;margin:0 auto;padding:18px clamp(14px,3vw,30px) 42px}.top{position:sticky;top:0;z-index:10;margin:-18px calc(clamp(14px,3vw,30px)*-1) 16px;padding:14px clamp(14px,3vw,30px);display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);background:rgba(8,13,26,.92);backdrop-filter:blur(14px)}.topnav{display:flex;gap:10px;flex-wrap:wrap}.back,.link,.topnav a{color:#bfdbfe;text-decoration:none}.topnav a{font-size:13px;border:1px solid #36507a;border-radius:999px;padding:7px 10px;background:#101a2e}.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 16px 40px rgba(0,0,0,.18)}h1{font-size:clamp(24px,6vw,38px);margin:6px 0}.sub,.muted{color:var(--muted)}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.metric{background:#0d1528;border:1px solid #22304c;border-radius:14px;padding:11px}.metric span{display:block;color:var(--muted);font-size:12px}.metric b{font-size:18px}.up{color:var(--red);font-weight:800}.down{color:var(--green);font-weight:800}.warn{color:var(--gold);font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px}.full{grid-column:1/-1}.pill{display:inline-block;border:1px solid #36507a;border-radius:999px;padding:5px 10px;margin:4px 6px 4px 0;color:#dbeafe;background:#101a2e}.risk{color:#fca5a5}.plan{color:#bfdbfe}.chart{width:100%;height:320px;background:#08111f;border:1px solid var(--line);border-radius:16px;margin-top:12px}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--line);padding:9px;text-align:left;font-size:13px;vertical-align:top}th{color:var(--muted)}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:1px solid #36507a;background:#12203a;color:#dbeafe;border-radius:999px;padding:8px 11px;text-decoration:none;font-size:13px;cursor:pointer}.note{color:var(--muted);font-size:13px;line-height:1.7}.section-title{margin:0 0 10px}.decision{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.decision-card{background:#0d1528;border:1px solid #22304c;border-radius:14px;padding:12px}.decision-card span{display:block;color:var(--muted);font-size:12px}.decision-card b{display:block;font-size:16px;margin-top:4px}.action-strip{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;padding:12px;border-radius:14px;background:#0d1528;border:1px solid #22304c}.timeline{display:grid;gap:10px}.timeline-item{padding:10px 12px;border-left:3px solid #60a5fa;background:#0d1528;border-radius:10px}.timeline-item b{display:block}.toc{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.toc a{color:#dbeafe;text-decoration:none;border:1px solid #36507a;border-radius:999px;padding:7px 10px;background:#101a2e;font-size:13px}@media(max-width:860px){.hero,.grid{grid-template-columns:1fr}.metrics,.decision{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.top{position:relative;display:block}.topnav{margin-top:10px}.metrics,.decision{grid-template-columns:1fr}.chart{height:260px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top"><a class="back" href="index.html">← 返回首页</a><nav class="topnav"><a href="#decision">决策</a><a href="#chart-block">K线</a><a href="#levels">关键位</a><a href="#profile-block">档案</a><a href="status.html">系统状态</a></nav><div class="muted" id="ts">加载中</div></div>
    <section class="hero">
      <div class="card">
        <div class="sub" id="industry">-</div>
        <h1><span id="name">个股详情</span> <span id="code" class="muted"></span></h1>
        <div id="diag" class="warn">正在读取个股资料…</div>
        <div class="toc"><a href="#decision">先看能不能做</a><a href="#levels">看买点/止损</a><a href="#signals-card">看策略理由</a><a href="#bars-block">看近期行情</a></div>
        <div class="metrics">
          <div class="metric"><span>最新价</span><b id="close">-</b></div>
          <div class="metric"><span>日涨跌</span><b id="pct">-</b></div>
          <div class="metric"><span>成交额</span><b id="amount">-</b></div>
          <div class="metric"><span>换手率</span><b id="turnover">-</b></div>
        </div>
        <div class="btns"><a id="em" class="btn" target="_blank">东方财富</a><a id="xq" class="btn" target="_blank">雪球</a><button id="fav" class="btn">收藏到浏览器</button></div>
      </div>
      <div class="card" id="decision">
        <h3 class="section-title">操作决策工作台</h3>
        <div id="opinion" class="warn">-</div>
        <div id="decisionPanel" class="decision"></div>
        <div id="execution" class="action-strip"></div>
      </div>
    </section>
    <section class="grid">
      <div class="card" id="signals-card"><h3 class="section-title">策略信号与风险计划</h3><div id="signals"></div></div>
      <div class="card" id="levels"><h3 class="section-title">关键价位</h3><div id="keyLevels"></div></div>
      <div class="card full" id="chart-block"><h3 class="section-title">近60日K线走势</h3><canvas id="chart" class="chart"></canvas></div>
      <div class="card" id="profile-block"><h3 class="section-title">基础档案</h3><div id="profile"></div></div>
      <div class="card"><h3 class="section-title">技术指标</h3><div id="indicators"></div></div>
      <div class="card"><h3 class="section-title">板块温度</h3><div id="sector"></div></div>
      <div class="card"><h3 class="section-title">事件时间线</h3><div id="timeline" class="timeline"></div></div>
      <div class="card full" id="bars-block"><h3 class="section-title">最近行情</h3><div style="overflow-x:auto"><table><thead><tr><th>日期</th><th>开</th><th>收</th><th>高</th><th>低</th><th>涨跌</th><th>成交额</th></tr></thead><tbody id="bars"></tbody></table></div></div>
      <div class="card full"><h3 class="section-title">产品说明</h3><div class="note">当前详情页按产品化分析工作台设计：第一屏先回答“能不能做”，再展开关键价位、策略理由、风险、技术指标与板块温度。策略测试体系后续单独升级，不在本页混杂。</div></div>
    </section>
  </main>
<script>
const qs=new URLSearchParams(location.search);const code=qs.get('code')||'';
const FAV_KEY='stock_dashboard_favorites_v1';
function fmt(x,d=2){return x==null?'-':Number(x).toFixed(d)}
function pctText(x){if(x==null)return '-';let n=Number(x);return (n>=0?'+':'')+n.toFixed(2)+'%'}
function money(x){if(x==null)return '-';let n=Number(x);if(Math.abs(n)>=1e8)return (n/1e8).toFixed(1)+'亿';if(Math.abs(n)>=1e4)return (n/1e4).toFixed(1)+'万';return n.toFixed(0)}
function cls(el,x){el.classList.remove('up','down');if(x!=null)el.classList.add(Number(x)>=0?'up':'down')}
function metricGrid(items){return `<div class="metrics">${items.map(([k,v])=>`<div class="metric"><span>${k}</span><b>${v}</b></div>`).join('')}</div>`}
function getFavs(){try{return JSON.parse(localStorage.getItem(FAV_KEY)||'[]')}catch(e){return []}}
function setFavs(v){localStorage.setItem(FAV_KEY,JSON.stringify(v))}
function addFav(d){let items=getFavs().filter(x=>x.code!==d.code);items.unshift({code:d.code,name:d.name,ts:Date.now()});setFavs(items.slice(0,20));fav.textContent='已收藏'}
function draw(bars){const c=document.getElementById('chart'),ctx=c.getContext('2d'),r=c.getBoundingClientRect(),dpr=devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,r.width,r.height);if(!bars.length)return;const pad=28,w=r.width-pad*2,h=r.height-pad*2;const vals=bars.flatMap(b=>[b.high,b.low]).filter(x=>x!=null);const hi=Math.max(...vals),lo=Math.min(...vals);const y=v=>pad+(hi-v)/(hi-lo||1)*h;const step=w/bars.length;ctx.strokeStyle='#26324d';ctx.lineWidth=1;for(let i=0;i<4;i++){let yy=pad+h*i/3;ctx.beginPath();ctx.moveTo(pad,yy);ctx.lineTo(pad+w,yy);ctx.stroke()}bars.forEach((b,i)=>{let x=pad+i*step+step/2;let up=(b.close>=b.open);ctx.strokeStyle=up?'#ff4d5e':'#22c55e';ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.moveTo(x,y(b.high));ctx.lineTo(x,y(b.low));ctx.stroke();let top=y(Math.max(b.open,b.close)),bot=y(Math.min(b.open,b.close));ctx.fillRect(x-step*.28,top,Math.max(2,step*.56),Math.max(2,bot-top))});ctx.fillStyle='#93a4c7';ctx.font='12px sans-serif';ctx.fillText(hi.toFixed(2),4,pad+4);ctx.fillText(lo.toFixed(2),4,pad+h)}
async function main(){if(!code){document.getElementById('diag').textContent='缺少股票代码';return}try{const r=await fetch(`stocks/${code}.json?t=${Date.now()}`,{cache:'no-store'});const d=await r.json();document.title=`${d.name} ${d.code}｜个股详情`;name.textContent=d.name;document.getElementById('code').textContent=d.code;industry.textContent=`${d.exchange||''}｜${d.industry||'-'}｜${d.board||'-'}`;ts.textContent=`详情生成：${d.generated_at}`;close.textContent=fmt(d.latest.close);pct.textContent=pctText(d.latest.pct_chg);cls(pct,d.latest.pct_chg);amount.textContent=money(d.latest.amount);turnover.textContent=fmt(d.latest.turnover)+'%';diag.textContent=`${d.diagnostics.structure_stage}｜${d.diagnostics.volume_price_phrase}`;opinion.textContent=d.diagnostics.operation_view.summary;em.href=d.external_links.eastmoney;xq.href=d.external_links.xueqiu;fav.onclick=()=>addFav(d);let dp=d.decision_panel||{};decisionPanel.innerHTML=metricGrid([['动作',dp.action||'-'],['评分',fmt(dp.score,0)],['策略',dp.strategy_label||'-'],['持有提示',dp.holding_hint||'-'],['买点',dp.buy_trigger||'-'],['止损',dp.stop_loss||'-'],['止盈',dp.take_profit||'-'],['MA20',fmt(dp.price_context?.ma20)]]);execution.innerHTML=`<div><b>${dp.execution||'-'}</b><div class="muted">理由：${(dp.reasons||[]).join('、')||'-'}</div><div class="risk">风险：${(dp.risks||[]).join('、')||'-'}</div></div>`;signals.innerHTML=(d.signals||[]).map(s=>`<div style="margin-top:10px"><span class="pill">${s.strategy_label} ${fmt(s.score,0)}分</span><span class="pill">${s.decision||'-'}</span><div class="muted">命中：${(s.reasons||[]).slice(0,5).join('、')||'-'}</div><div class="risk">风险：${(s.risks||[]).slice(0,4).join('、')||'-'}</div><div class="plan">计划：买点 ${s.plan?.买点||'-'}；止损 ${s.plan?.止损||'-'}；止盈 ${s.plan?.止盈||'-'}</div></div>`).join('')||'未进入最新候选榜';keyLevels.innerHTML=metricGrid([['当前价',fmt(d.key_levels?.current_price)],['MA20',fmt(d.key_levels?.ma20)],['MA60',fmt(d.key_levels?.ma60)],['20日突破',fmt(d.key_levels?.breakout_20d)],['55日突破',fmt(d.key_levels?.breakout_55d)],['20日防守低点',fmt(d.key_levels?.defense_20d_low)]]);profile.innerHTML=metricGrid([['行业',d.industry||'-'],['交易所',d.exchange||'-'],['总市值',money(d.market_cap?.total_mv)],['流通市值',money(d.market_cap?.float_mv)]]);indicators.innerHTML=metricGrid([['MA5',fmt(d.indicators?.ma5)],['MA10',fmt(d.indicators?.ma10)],['MA20',fmt(d.indicators?.ma20)],['MA60',fmt(d.indicators?.ma60)],['EMA20',fmt(d.indicators?.ema20)],['RSI14',fmt(d.indicators?.rsi14)],['MACD柱',fmt(d.indicators?.macd_hist)],['20日高',fmt(d.indicators?.high20)]]);sector.innerHTML=metricGrid([['板块分',fmt(d.sector_snapshot?.sector_score)],['样本数',fmt(d.sector_snapshot?.universe_count,0)],['上涨占比',fmt(d.sector_snapshot?.up_ratio)+'%'],['MA20上方',fmt(d.sector_snapshot?.above_ma20_ratio)+'%']])+`<p class="muted">${d.sector_snapshot?.sector_state||'-'}</p>`;timeline.innerHTML=(d.timeline||[]).map(x=>`<div class="timeline-item"><b>${x.label}｜${x.value||'-'}</b><span class="muted">${x.note||'-'}</span></div>`).join('')||'<div class="muted">暂无时间线</div>';bars.innerHTML=(d.bars||[]).slice(-20).reverse().map(b=>`<tr><td>${b.date}</td><td>${fmt(b.open)}</td><td>${fmt(b.close)}</td><td>${fmt(b.high)}</td><td>${fmt(b.low)}</td><td class="${(b.pct_chg||0)>=0?'up':'down'}">${pctText(b.pct_chg)}</td><td>${money(b.amount)}</td></tr>`).join('');draw(d.bars||[])}catch(e){diag.textContent='详情加载失败：'+e}}
main();
</script>
</body>
</html>
