<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>个股详情｜股神A股交易决策看板</title>
  <style>
    :root{--bg:#080d1a;--panel:#111827;--panel2:#151f34;--muted:#93a4c7;--text:#edf3ff;--line:#26324d;--red:#ff4d5e;--green:#22c55e;--gold:#fbbf24;--blue:#60a5fa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#172554 0,#080d1a 42%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,'Microsoft YaHei',sans-serif}.wrap{max-width:1180px;margin:0 auto;padding:18px clamp(14px,3vw,30px) 40px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px}.back,.link{color:#bfdbfe;text-decoration:none}.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 16px 40px rgba(0,0,0,.18)}h1{font-size:clamp(24px,6vw,38px);margin:6px 0}.sub,.muted{color:var(--muted)}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.metric{background:#0d1528;border:1px solid #22304c;border-radius:14px;padding:11px}.metric span{display:block;color:var(--muted);font-size:12px}.metric b{font-size:18px}.up{color:var(--red);font-weight:800}.down{color:var(--green);font-weight:800}.warn{color:var(--gold);font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px}.full{grid-column:1/-1}.pill{display:inline-block;border:1px solid #36507a;border-radius:999px;padding:5px 10px;margin:4px 6px 4px 0;color:#dbeafe;background:#101a2e}.risk{color:#fca5a5}.plan{color:#bfdbfe}.chart{width:100%;height:320px;background:#08111f;border:1px solid var(--line);border-radius:16px;margin-top:12px}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--line);padding:9px;text-align:left;font-size:13px;vertical-align:top}th{color:var(--muted)}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:1px solid #36507a;background:#12203a;color:#dbeafe;border-radius:999px;padding:8px 11px;text-decoration:none;font-size:13px}@media(max-width:820px){.hero,.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.top{display:block}.chart{height:240px}}@media(max-width:520px){.metrics{grid-template-columns:1fr}.card{padding:14px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top"><a class="back" href="index.html">← 返回看板</a><div class="muted" id="ts">加载中</div></div>
    <section class="hero">
      <div class="card">
        <div class="sub" id="industry">-</div>
        <h1><span id="name">个股详情</span> <span id="code" class="muted"></span></h1>
        <div id="diag" class="warn">正在读取个股资料…</div>
        <div class="metrics">
          <div class="metric"><span>最新价</span><b id="close">-</b></div>
          <div class="metric"><span>日涨跌</span><b id="pct">-</b></div>
          <div class="metric"><span>成交额</span><b id="amount">-</b></div>
          <div class="metric"><span>换手率</span><b id="turnover">-</b></div>
        </div>
        <div class="btns"><a id="em" class="btn" target="_blank">东方财富</a><a id="xq" class="btn" target="_blank">雪球</a></div>
      </div>
      <div class="card">
        <h3>策略结论</h3>
        <div id="opinion" class="warn">-</div>
        <div id="signals"></div>
      </div>
    </section>
    <section class="card full" style="margin-top:14px">
      <h3>近60日K线走势</h3>
      <canvas id="chart" class="chart"></canvas>
    </section>
    <section class="grid">
      <div class="card"><h3>关键指标</h3><div id="indicators"></div></div>
      <div class="card"><h3>板块温度</h3><div id="sector"></div></div>
      <div class="card full"><h3>最近行情</h3><div style="overflow-x:auto"><table><thead><tr><th>日期</th><th>开</th><th>收</th><th>高</th><th>低</th><th>涨跌</th><th>成交额</th></tr></thead><tbody id="bars"></tbody></table></div></div>
    </section>
  </main>
<script>
const qs=new URLSearchParams(location.search);const code=qs.get('code')||'';
function fmt(x,d=2){return x==null?'-':Number(x).toFixed(d)}
function pct(x){if(x==null)return '-';let n=Number(x);return (n>=0?'+':'')+n.toFixed(2)+'%'}
function money(x){if(x==null)return '-';let n=Number(x);if(Math.abs(n)>=1e8)return (n/1e8).toFixed(1)+'亿';if(Math.abs(n)>=1e4)return (n/1e4).toFixed(1)+'万';return n.toFixed(0)}
function cls(el,x){el.classList.remove('up','down');if(x!=null)el.classList.add(Number(x)>=0?'up':'down')}
function kv(obj, keys){return keys.map(([k,n,u=''])=>`<div class="metric"><span>${n}</span><b>${fmt(obj?.[k])}${obj?.[k]==null?'':u}</b></div>`).join('')}
function draw(bars){const c=document.getElementById('chart'),ctx=c.getContext('2d'),r=c.getBoundingClientRect(),dpr=devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,r.width,r.height);if(!bars.length)return;const pad=28,w=r.width-pad*2,h=r.height-pad*2;const vals=bars.flatMap(b=>[b.high,b.low]).filter(x=>x!=null);const hi=Math.max(...vals),lo=Math.min(...vals);const y=v=>pad+(hi-v)/(hi-lo||1)*h;const step=w/bars.length;ctx.strokeStyle='#26324d';ctx.lineWidth=1;for(let i=0;i<4;i++){let yy=pad+h*i/3;ctx.beginPath();ctx.moveTo(pad,yy);ctx.lineTo(pad+w,yy);ctx.stroke()}bars.forEach((b,i)=>{let x=pad+i*step+step/2;let up=(b.close>=b.open);ctx.strokeStyle=up?'#ff4d5e':'#22c55e';ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.moveTo(x,y(b.high));ctx.lineTo(x,y(b.low));ctx.stroke();let top=y(Math.max(b.open,b.close)),bot=y(Math.min(b.open,b.close));ctx.fillRect(x-step*.28,top,Math.max(2,step*.56),Math.max(2,bot-top))});ctx.fillStyle='#93a4c7';ctx.font='12px sans-serif';ctx.fillText(hi.toFixed(2),4,pad+4);ctx.fillText(lo.toFixed(2),4,pad+h)}
async function main(){if(!code){document.getElementById('diag').textContent='缺少股票代码';return}try{const r=await fetch(`stocks/${code}.json?t=${Date.now()}`,{cache:'no-store'});const d=await r.json();document.title=`${d.name} ${d.code}｜个股详情`;name.textContent=d.name;document.getElementById('code').textContent=d.code;industry.textContent=`${d.exchange||''}｜${d.industry||'-'}｜${d.board||'-'}`;ts.textContent=`详情生成：${d.generated_at}`;close.textContent=fmt(d.latest.close);pct.textContent=pct(d.latest.pct_chg);cls(pct,d.latest.pct_chg);amount.textContent=money(d.latest.amount);turnover.textContent=fmt(d.latest.turnover)+'%';diag.textContent=`${d.diagnostics.structure_stage}｜${d.diagnostics.volume_price_phrase}`;opinion.textContent=d.diagnostics.operation_view.summary;em.href=d.external_links.eastmoney;xq.href=d.external_links.xueqiu;signals.innerHTML=(d.signals||[]).map(s=>`<div style="margin-top:10px"><span class="pill">${s.strategy_label} ${fmt(s.score,0)}分</span><span class="pill">${s.decision||'-'}</span><div class="muted">命中：${(s.reasons||[]).slice(0,5).join('、')||'-'}</div><div class="risk">风险：${(s.risks||[]).slice(0,4).join('、')||'-'}</div><div class="plan">计划：买点 ${s.plan?.买点||'-'}；止损 ${s.plan?.止损||'-'}</div></div>`).join('')||'未进入最新候选榜';indicators.innerHTML='<div class="metrics">'+kv(d.indicators,[['ma5','MA5'],['ma10','MA10'],['ma20','MA20'],['ma60','MA60'],['rsi14','RSI14'],['macd_hist','MACD柱'],['high20','20日高'],['high55','55日高']])+'</div>';sector.innerHTML=`<div class="metrics">${kv(d.sector_snapshot||{},[['sector_score','板块分'],['universe_count','样本数'],['up_ratio','上涨占比','%'],['above_ma20_ratio','MA20上方','%']])}</div><p class="muted">${d.sector_snapshot?.sector_state||'-'}</p>`;bars.innerHTML=(d.bars||[]).slice(-12).reverse().map(b=>`<tr><td>${b.date}</td><td>${fmt(b.open)}</td><td>${fmt(b.close)}</td><td>${fmt(b.high)}</td><td>${fmt(b.low)}</td><td class="${(b.pct_chg||0)>=0?'up':'down'}">${pct(b.pct_chg)}</td><td>${money(b.amount)}</td></tr>`).join('');draw(d.bars||[]);addEventListener('resize',()=>draw(d.bars||[]));}catch(e){diag.textContent='详情加载失败：'+e}}
main();
</script>
</body>
</html>
